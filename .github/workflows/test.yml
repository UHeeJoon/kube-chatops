# Python 서비스 문법 검사와 비밀 값 검사. 서비스별 단위 테스트는 생기는 대로 추가한다.
name: test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --select E9,F services demo ml

  ml-anomaly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/anomaly-train/requirements.txt
      - run: pip install -r ml/anomaly-train/requirements.txt pytest
      - name: 이상 탐지 모델 단위 테스트 (합성 데이터)
        working-directory: ml/anomaly-train
        run: python -m pytest -q tests
