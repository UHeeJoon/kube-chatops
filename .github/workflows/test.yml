# Python 서비스 문법 검사, 비밀 값 검사, MCP 서버 조회 범위 시험. 서비스별 단위 테스트는 생기는 대로 추가한다.
name: test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --select E9,F services demo ml

  ml-anomaly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/anomaly-train/requirements.txt
      - run: pip install -r ml/anomaly-train/requirements.txt pytest
      - name: 이상 탐지 모델 단위 테스트 (합성 데이터)
        working-directory: ml/anomaly-train
        run: python -m pytest -q tests
      - name: 파드별 채점 단위 테스트 (의존성 없는 모듈)
        working-directory: services/mcp-anomaly
        run: python -m pytest -q tests
      - run: pip install -r ml/anomaly-serve/requirements.txt
      - name: 서빙 계약 시험 (학습이 만든 모델 → 서빙 코드 → mcp-anomaly 요청 모양)
        working-directory: ml/anomaly-serve
        run: python -m pytest -q tests

  # MCP 서버의 조회 범위 시험: 모든 도구가 허용 네임스페이스 밖을 거절하는지 (백엔드 없이).
  # 새 도구를 추가하면 namespace 를 받아 검사하거나, tests/test_scope.py 의 UNSCOPED 에 이유를 적어야 통과한다.
  mcp-scope:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [mcp-k8s, mcp-loki, mcp-prometheus]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - run: pip install -r services/${{ matrix.service }}/requirements.txt pytest
      - name: 범위 시험
        working-directory: services/${{ matrix.service }}
        env:
          PYTHONPATH: ../mcp-common:.
        run: python -m pytest -q tests

  # 런북 검색 서버 단위 테스트 (DB 없이: 청크 나누기, 사건 응답 줄이기, 알림 → 런북 표가 실제 런북과 맞는지)
  mcp-runbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/mcp-runbook
      - name: 단위 테스트
        working-directory: services/mcp-runbook
        run: cargo test --quiet

  # n8n 워크플로: 생성 결과가 저장소의 JSON 과 같은지(코드만 고치고 다시 만들지 않은 경우를 잡는다),
  # 승인·격리·오류 처리의 Code 노드가 가짜 입력에서 기대대로 판단하는지
  n8n-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 생성 결과가 저장소와 같은가
        run: python n8n/build_workflows.py && git diff --exit-code -- n8n/workflows
      - name: Code 노드 판단 시험
        run: node n8n/test_workflows.js n8n/workflows

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: 에이전트 단위 테스트 (인용 검증. 의존성 없는 모듈만)
        working-directory: services/agent
        run: python -m pytest -q tests
