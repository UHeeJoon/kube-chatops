[package]
name = "mcp-runbook"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
fastembed = { version = "7.8.0", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls", "onig"] }
prometheus = { version = "0.14", default-features = false }
rmcp = { version = "3.12.0", features = ["server", "transport-streamable-http-server", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "derive"] }
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

[profile.release]
lto = "thin"
strip = true
